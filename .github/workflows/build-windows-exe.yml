name: Build Windows exe

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    paths:
      - "case_extractor/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: case_extractor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        shell: bash
        run: |
          set -e
          EXE_NAME="PanryeCodingConverter-v${{ github.run_number }}"
          echo "EXE_NAME=$EXE_NAME" >> "$GITHUB_ENV"
          pyinstaller --noconfirm --onefile --windowed \
            --name "$EXE_NAME" \
            --collect-all pdfplumber \
            --collect-all pypdfium2 \
            --collect-all anthropic \
            --hidden-import docx \
            gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: PanryeCodingConverter-windows-exe
          path: case_extractor/dist/${{ env.EXE_NAME }}.exe
          retention-days: 30

      - name: Publish versioned release (kept permanently)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION_TAG="windows-exe-v${{ github.run_number }}"
          gh release create "$VERSION_TAG" \
            "dist/${EXE_NAME}.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --title "판례 코딩시트 변환기 (Windows exe) v${{ github.run_number }}" \
            --notes "커밋 ${{ github.sha }} 으로 빌드된 버전입니다. 실행파일 이름: ${EXE_NAME}.exe — 이 버전은 새 빌드가 나와도 삭제되지 않고 그대로 남아있습니다."

      - name: Publish/update "windows-exe-latest" rolling release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete windows-exe-latest --yes --repo "$GITHUB_REPOSITORY" || true
          git tag -f windows-exe-latest
          git push -f origin windows-exe-latest
          gh release create windows-exe-latest \
            "dist/${EXE_NAME}.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --title "판례 코딩시트 변환기 (Windows exe, 최신) - ${EXE_NAME}" \
            --notes "가장 최근 커밋(${{ github.sha }})으로 빌드된 Windows용 실행파일입니다 (파일명: ${EXE_NAME}.exe). 이전 버전들은 저장소의 Releases 목록(windows-exe-v1, v2, ...)에서 계속 받을 수 있습니다." \
            --latest
