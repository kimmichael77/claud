name: Build macOS app

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    paths:
      - "case_extractor/**"
      - ".github/workflows/build-macos-app.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: case_extractor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        shell: bash
        run: |
          set -e
          APP_NAME="PanryeCodingConverter-v${{ github.run_number }}"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          pyinstaller --noconfirm --windowed \
            --name "$APP_NAME" \
            --collect-all pdfplumber \
            --collect-all pypdfium2 \
            --collect-all anthropic \
            --hidden-import docx \
            gui.py
          cd dist
          zip -r -y "${APP_NAME}-macOS.zip" "${APP_NAME}.app"

      - uses: actions/upload-artifact@v4
        with:
          name: PanryeCodingConverter-macos-app
          path: case_extractor/dist/${{ env.APP_NAME }}-macOS.zip
          retention-days: 30

      - name: Publish versioned release (kept permanently)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION_TAG="macos-app-v${{ github.run_number }}"
          gh release create "$VERSION_TAG" \
            "dist/${APP_NAME}-macOS.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "판례 코딩시트 변환기 (macOS 앱) v${{ github.run_number }}" \
            --notes "커밋 ${{ github.sha }} 으로 빌드된 버전입니다. 압축을 풀면 ${APP_NAME}.app 이 나옵니다. 이 버전은 새 빌드가 나와도 삭제되지 않고 그대로 남아있습니다."

      - name: Publish/update "macos-app-latest" rolling release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete macos-app-latest --yes --repo "$GITHUB_REPOSITORY" || true
          git tag -f macos-app-latest
          git push -f origin macos-app-latest
          gh release create macos-app-latest \
            "dist/${APP_NAME}-macOS.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "판례 코딩시트 변환기 (macOS 앱, 최신) - ${APP_NAME}" \
            --notes "가장 최근 커밋(${{ github.sha }})으로 빌드된 macOS용 앱입니다 (압축 풀면 ${APP_NAME}.app). 이전 버전들은 저장소의 Releases 목록(macos-app-v1, v2, ...)에서 계속 받을 수 있습니다." \
            --latest
